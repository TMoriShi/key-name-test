<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>サックス パーツ記述テスト</title>
  <style>
    :root {
      --bg-color: #121214;
      --panel-bg: #1a1a1e;
      --accent-color: #ffb86c;
      --success-color: #50fa7b;
      --error-color: #ff5555;
      --text-color: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    #mode-control, #dynamic-placement-zone, #view-viewport, #control-panel, #parts-list-container {
      width: 100%;
      max-width: 900px; 
      box-sizing: border-box;
    }

    /* モード切り替え */
    #mode-control {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .mode-btn {
      flex: 1;
      background: #2a2a32;
      color: #fff;
      border: 2px solid #444;
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    @media (min-width: 480px) {
      .mode-btn { font-size: 15px; padding: 12px; }
    }
    .mode-btn.active {
      border-color: var(--accent-color);
      background: rgba(255, 184, 108, 0.1);
      color: var(--accent-color);
    }

    /* テストモード用の一括採点ヘッダー */
    #test-summary-bar {
      width: 100%;
      max-width: 900px;
      background: #221f29;
      border: 1px solid #443b5c;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    #test-progress-text {
      font-weight: bold;
      font-size: 14px;
    }
    #final-score-btn {
      background: var(--accent-color);
      color: #121214;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    /* ビューポート */
    #view-viewport {
      aspect-ratio: 4 / 3;
      background: #09090b;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid #232329;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #scalableWrapper {
      position: absolute;
      width: 1200px;
      height: 900px;
      transform-origin: 0 0;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .sax-canvas {
      position: absolute;
      width: 1200px;
      height: 900px;
    }

    .base-image {
      position: absolute;
      width: 1200px;
      height: 900px;
      pointer-events: none;
      opacity: 0.8;
    }

    .key-layer {
      position: absolute;
      width: 1200px;
      height: 900px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .key-layer.show {
      opacity: 1;
    }

    #svgOverlay {
      position: absolute;
      width: 1200px;
      height: 900px;
    }

    .clickable-trigger {
      fill: rgba(0, 0, 0, 0); 
      stroke: rgba(0, 0, 0, 0);
      stroke-width: 1;
      cursor: pointer;
    }

    /* コントロールエリア */
    #control-panel {
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid #2e2e38;
    }

    #info-display {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 2px;
    }
    #info-sub {
      font-size: 12px;
      color: #8a8a93;
      text-align: center;
      font-family: monospace;
      margin-bottom: 12px;
    }

    /* 記述フォーム */
    #input-form {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 8px;
    }

    #answer-input {
      flex: 1;
      background: #121214;
      color: #fff;
      border: 1px solid #444;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    #answer-input:focus {
      border-color: var(--accent-color);
      outline: none;
    }

    #submit-btn {
      background: var(--accent-color);
      color: #121214;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* パーツ一覧エリア - コンパクトに修正 */
    #parts-list-container {
      background: var(--panel-bg);
      padding: 10px;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid #2e2e38;
    }
    #parts-list-title {
      font-size: 13px;
      font-weight: bold;
      color: #8a8a93;
      margin-bottom: 8px;
      border-bottom: 1px solid #2e2e38;
      padding-bottom: 5px;
    }
    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 4px;
    }
    .part-item-btn {
      background: #2a2a32;
      color: #e2e8f0;
      border: 1px solid #444;
      padding: 4px 4px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
    }
    .part-item-btn:hover {
      border-color: var(--accent-color);
      background: rgba(255, 184, 108, 0.1);
    }
    .part-item-btn.active-part {
      border-color: var(--accent-color);
      background: var(--accent-color);
      color: #121214;
      font-weight: bold;
    }
    /* テストモードでの状態別スタイル */
    .part-item-btn.has-filled {
      border-color: #6272a4;
      background: #282a36;
    }
    .part-item-btn.test-correct {
      border-color: var(--success-color);
      background: rgba(80, 250, 123, 0.15);
      color: var(--success-color);
    }
    .part-item-btn.test-incorrect {
      border-color: var(--error-color);
      background: rgba(255, 85, 85, 0.15);
      color: var(--error-color);
    }
  </style>
</head>
<body class="mode-browse">

  <!-- モード切替 -->
  <div id="mode-control">
    <button id="btn-browse" class="mode-btn active" onclick="switchMode('browse')">🔍 探索</button>
    <button id="btn-quiz" class="mode-btn" onclick="switchMode('quiz')">📝 エンドレス練習</button>
    <button id="btn-test" class="mode-btn" onclick="switchMode('test')">🏆 自由順全パーツテスト</button>
  </div>

  <!-- テストモード用サマリーバー -->
  <div id="test-summary-bar" style="display: none;">
    <div id="test-progress-text">解答状況: 0 / 52 パーツ</div>
    <button id="final-score-btn" onclick="gradeAllTestAnswers()">📊 今すぐ一括採点する</button>
  </div>

  <!-- クイズ・テスト時にフォームがここに移動 -->
  <div id="dynamic-placement-zone"></div>

  <!-- ビューポート -->
  <div id="view-viewport">
    <div id="scalableWrapper">
      <div class="sax-canvas">
        <img src="base_front.PNG" class="base-image" alt="Saxophone Base">
        <svg id="svgOverlay">
          <g id="polygonGroup"></g>
        </svg>
      </div>
    </div>
  </div>

  <!-- 下部：入力・情報エリア -->
  <div id="control-panel">
    <div id="info-display">サックスのパーツにマウスを当ててみてください</div>
    <div id="info-sub">-</div>
    
    <!-- 記述入力フォーム（初期状態） -->
    <form id="input-form" style="display: none;" onsubmit="handleFormSubmit(event)">
      <input type="text" id="answer-input" placeholder="パーツ名を入力..." autocomplete="off" enterkeyhint="send">
      <button type="submit" id="submit-btn">決定</button>
    </form>
  </div>

  <!-- パーツ名前一覧 -->
  <div id="parts-list-container">
    <div id="parts-list-title">📋 パーツ一覧（クリックで該当位置へズーム）</div>
    <div class="parts-grid" id="partsGrid"></div>
  </div>

  <script>
  const canvasWidth = 1200;  
  const canvasHeight = 900; 
  let currentMode = 'browse'; 
  let quizCorrectId = "";
  let currentFocusedId = null; // 探索モードで現在ズームしているパーツを記録
  let quizList = [];
  
  // テストモード用管理データ
  let testAnswers = {}; // { partId: "ユーザーの入力した文字列" }
  let isGraded = false; // 採点完了フラグ
  let testOrder = [];   // テストモード時のボタン並び替え用の配列

  const keyData = {"mouthpiece":"マウスピース","ligature":"リガチャー","neck_cork":"ネックコルク","octave_1":"第1オクターブキィ","octave_2":"第2オクターブキィ","high_f_sharp_key":"HighF#キィ","high_f_key":"HighFキィ","high_e_key":"HighEキィ","front_f_lever":"フロントFレバー","c_key":"Cキィ","b_key":"Bキィ","bb_key":"Bbキィ","a_key":"Aキィ","g_key":"Gキィ","g_sharp_key":"G#キィ","f_sharp_key":"F#キィ","f_key":"Fキィ","e_key":"Eキィ","d_key":"Dキィ","eb_key":"Ebキィ","low_c_key":"LowCキィ","low_c_sharp_key":"LowC#キィ","low_b_key":"LowBキィ","low_bb_key":"LowBbキィ","bell":"ベル","key_guard":"キィガード","neck_screw":"ネック止めネジ","high_f_sharp_key_back":"HighF#キィ","high_f_key_back":"HighFキィ","high_eb_key":"HighEbキィ","high_d_key":"HighDキィ","c_sharp_lever":"G#レバー","low_b_key_back":"LowBキィ","low_c_sharp_lever":"LowC#レバー","low_bb_key_back":"LowBbキィ","pipe_2":"2番管","thumb_hook":"サムフック","side_guard_cross_guard":"サイドガード/クロスガード","body_ring":"胴輪","pipe_1":"1番管","eb_key_back":"Ebキィ","high_f_sharp_lever":"HighF#レバー","side_bb_lever":"SideBbレバー","side_c_lever":"SideCレバー","side_f_sharp_key":"SideF#キィ","high_e_key_back":"HighEキィ","lap_ring":"ストラップリング","side_bb_key":"SideBbキィ","side_c_key":"SideCキィ","thumb_rest":"サムレスト","tar_lever":"オクターブレバー","lyre_holder":"譜立て","reinforcement_plate":"補強板"};
  const pathCoordinates = {"mouthpiece":[[105,140],[140,130],[169,146],[160,158],[141,158],[120,150]],"ligature":[[127,126],[150,129],[134,165],[117,157]],"neck_cork":[[166,140],[181,151],[174,166],[151,160]],"front_f_lever":[[272,322],[275,343],[278,375],[258,385],[267,349],[251,341],[266,326]],"bell":[[295,500],[363,516],[420,564],[379,596],[367,649],[361,769],[327,770],[309,711],[324,644],[288,638]],"key_guard":[[290,642],[326,638],[308,654],[306,706],[303,766],[316,782],[287,856],[247,868],[212,830],[258,852],[283,828],[278,758]],"octave_1":[[221,288],[242,287],[239,298],[221,291]],"octave_2":[[195,153],[196,148],[259,173],[272,238],[263,200],[255,226],[227,245],[252,220],[256,189],[235,169]],"high_f_sharp_key":[[250,259],[266,262],[266,284],[250,281],[219,287],[249,275]],"high_f_key":[[265,279],[277,281],[284,397],[305,436],[274,410],[278,377],[268,307]],"high_e_key":[[242,299],[257,298],[257,320],[239,322],[240,312],[224,309],[239,305]],"c_key":[[227,362],[252,362],[259,353],[266,362],[259,372],[255,365],[228,369]],"b_key":[[226,393],[252,382],[273,380],[277,403],[263,409],[247,397]],"bb_key":[[248,417],[275,425],[277,448],[248,447],[244,438],[224,435],[246,427]],"a_key":[[249,459],[273,460],[274,477],[249,480],[247,475],[226,472],[252,470]],"g_key":[[250,490],[270,489],[270,525],[249,526],[246,506],[217,505],[248,502]],"g_sharp_key":[[248,537],[278,536],[275,565],[246,569],[245,556],[221,552],[245,548]],"f_sharp_key":[[240,581],[272,579],[271,611],[241,613]],"f_key":[[235,619],[275,619],[275,659],[235,659]],"e_key":[[237,771],[277,671],[277,711],[237,711]],"d_key":[[235,717],[275,717],[272,753],[261,766],[235,757]],"eb_key":[[199,800],[228,777],[230,793],[221,798],[202,807]],"low_c_key":[[258,815],[269,830],[264,848],[237,844],[238,820],[222,798],[198,783],[213,784],[242,814]],"low_c_sharp_key":[[306,798],[314,817],[306,840],[286,833],[289,815],[274,780],[295,807]],"low_b_key":[[278,703],[279,731],[297,724],[313,741],[309,769],[283,774],[270,732]],"low_bb_key":[[270,632],[284,629],[278,653],[312,671],[295,699],[273,683]],"neck_screw":[[822,268],[839,265],[834,280],[821,276]],"high_f_sharp_key_back":[[916, 290],[926,391],[925,311],[911,312]],"high_f_key_back":[[925,307],[943,307],[936,327],[935,389],[930,426],[933,462],[922,464],[928,424],[931,391],[930,331],[926,328]],"high_eb_key":[[940,341],[957,345],[955,358],[943,363],[941,397],[940,414],[932,428],[928,411],[937,399],[937,361]],"high_d_key":[[954,361],[964,370],[957,385],[957,417],[962,434],[956,456],[949,437],[953,419],[951,386],[943,373]],"c_sharp_lever":[[915,489],[927,485],[930,484],[933,487],[935,495],[915,499]],"low_b_key_back":[[915,502],[928,501],[930,512],[918,515]],"low_c_sharp_lever":[[929,502],[941,494],[945,512],[934,513]],"low_bb_key_back":[[918,519],[951,515],[948,532],[924,534]],"pipe_2":[[942,414],[962,414],[946,422],[947,455],[960,451],[978,767],[926,771],[938,569],[928,540],[953,532],[943,487],[928,479],[939,454],[932,431]],"thumb_hook":[[973,669],[1009,655],[1007,669],[1002,675],[984,666],[981,724],[974,725]],"side_guard_cross_guard":[[942,630],[956,630],[957,730],[946,754],[945,705]],"body_ring":[[925,774],[982,782],[978,788],[922,790]],"pipe_1":[[877,799],[922,790],[975,788],[966,829],[947,856],[913,872],[878,866]],"eb_key_back":[[782,811],[819,836],[790,847],[762,845],[759,816]],"high_f_sharp_lever":[[811,680],[821,679],[821,716],[811,717]],"side_bb_lever":[[804,673],[816,672],[815,699],[805,697]],"side_c_lever":[[805,645],[817,646],[815,672],[803,669]],"side_f_sharp_key":[[764,640],[783,642],[782,657],[803,662],[781,662],[783,673],[765,674]],"high_e_key_back":[[810,621],[822,618],[815,639],[804,642],[806,632]],"lap_ring":[[774,541],[794,545],[796,569],[772,562]],"side_bb_key":[[787,485],[809,486],[810,506],[799,510],[800,558],[790,557],[792,511],[785,508]],"side_c_key":[[785,420],[810,420],[808,444],[804,443],[802,445],[795,478],[794,448],[786,445]],"tar_lever":[[777,341],[787,341],[783,360],[790,378],[787,410],[775,380]],"lyre_holder":[[778,307],[791,308],[792,326],[778,325]],"reinforcement_plate":[[759,192],[795,210],[803,231],[798,248],[788,223]],"thumb_rest":[[781,398],[780,417],[774,408],[786,409]]};

  document.addEventListener("DOMContentLoaded", () => {
    initImages();
    buildHitboxes();
    buildPartsList();
    updateLayout();

    // 画面のどこか（関係ないところ）をクリックした時に全体表示に戻す
    document.addEventListener("click", (e) => {
      if (currentMode === 'browse' && currentFocusedId !== null) {
        clearBrowseState();
      }
    });
  });
  window.addEventListener('resize', updateLayout);

  function initImages() {
    const canvas = document.querySelector('.sax-canvas');
    const overlay = document.getElementById('svgOverlay');
    Object.keys(keyData).forEach(id => {
      const img = document.createElement('img');
      let fileName = id;
      if (id === "f_sharp_key") fileName = "f_sharp";
      else if (id === "g_sharp_key") fileName = "g_sharp_key";
      else if (id.startsWith("high_") && !id.endsWith("_back") && id !== "high_eb_key" && id !== "high_d_key") fileName = id.replace("_key", "");
      else if (id.startsWith("low_") && !id.endsWith("_back") && !id.endsWith("_lever")) fileName = id.replace("_key", "");
      
      img.src = `${fileName}.PNG`;
      img.id = `layer_${id}`;
      img.classList.add('key-layer');
      canvas.insertBefore(img, overlay);
    });
  }

  function buildHitboxes() {
    const group = document.getElementById("polygonGroup");
    Object.keys(pathCoordinates).forEach(id => {
      const points = pathCoordinates[id];
      if (points.length < 2) return;
      
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const dStr = points.map((p, i) => `${i===0?'M':'L'}${p[0]},${p[1]}`).join(" ") + " Z";
      path.setAttribute("d", dStr);
      path.setAttribute("id", `hitbox_${id}`);
      path.setAttribute("class", "clickable-trigger");
      
      path.addEventListener("mouseenter", () => {
        if (currentMode !== 'browse' || currentFocusedId !== null) return;
        document.querySelectorAll('.part-item-btn').forEach(b => b.classList.remove('active-part'));
        document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));

        document.getElementById("info-display").innerText = keyData[id];
        document.getElementById("info-sub").innerText = `ID: ${id}`;
        document.getElementById(`layer_${id}`)?.classList.add("show");
      });

      path.addEventListener("mouseleave", () => {
        if (currentMode !== 'browse' || currentFocusedId !== null) return;
        document.getElementById("info-display").innerText = "サックスのパーツにマウスを当ててみてください";
        document.getElementById("info-sub").innerText = "-";
        document.getElementById(`layer_${id}`)?.classList.remove("show");
      });

      path.addEventListener("click", (e) => {
        e.stopPropagation(); // 背景クリックを防止
        if (currentMode === 'test') {
          selectTestPart(id);
        } else if (currentMode === 'browse') {
          if (currentFocusedId === id) {
            clearBrowseState(); // もう一度押したら元に戻る
          } else {
            setBrowseState(id); // それ以外なら対象へズーム
          }
        }
      });

      group.appendChild(path);
    });
  }

  // パーツ一覧のDOM組み立て
  function buildPartsList() {
    const grid = document.getElementById("partsGrid");
    grid.innerHTML = "";

    let renderIds = Object.keys(keyData);

    if (currentMode === 'test') {
      renderIds = [...testOrder];
    }

    renderIds.forEach(id => {
      const btn = document.createElement("button");
      btn.className = "part-item-btn";
      btn.id = `btn_list_${id}`;
      btn.innerText = (currentMode === 'test') ? `❓ パーツ` : keyData[id];
      
      btn.addEventListener("click", (e) => {
        e.stopPropagation(); // 背景クリックを防止
        if (currentMode === 'browse') {
          if (currentFocusedId === id) {
            clearBrowseState(); // もう一度押したら元に戻る
          } else {
            setBrowseState(id); // 対象へズーム
          }
        } else if (currentMode === 'test') {
          selectTestPart(id);
        }
      });
      grid.appendChild(btn);
    });
  }

  // 探索モードでフォーカスを解除する関数
  function clearBrowseState() {
    document.querySelectorAll('.key-layer').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.part-item-btn').forEach(b => b.classList.remove('active-part'));
    document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));

    document.getElementById("info-display").innerText = "サックスのパーツにマウスを当ててみてください";
    document.getElementById("info-sub").innerText = "-";
    
    currentFocusedId = null;
    resetZoom();
  }

  // 探索モードで特定のパーツにフォーカスする関数
  function setBrowseState(id) {
    document.querySelectorAll('.key-layer').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.part-item-btn').forEach(b => b.classList.remove('active-part'));
    document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));

    document.getElementById(`layer_${id}`)?.classList.add("show");
    document.getElementById(`hitbox_${id}`)?.classList.add('quiz-target');
    const btn = document.getElementById(`btn_list_${id}`);
    if(btn) btn.classList.add("active-part");

    document.getElementById("info-display").innerText = keyData[id];
    document.getElementById("info-sub").innerText = `ID: ${id}`;
    
    currentFocusedId = id;
    focusOnPart(id);
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function switchMode(mode) {
    currentMode = mode;
    currentFocusedId = null; 
    
    document.body.className = `mode-${mode}`;
    
    document.getElementById("btn-browse").classList.toggle("active", mode === 'browse');
    document.getElementById("btn-quiz").classList.toggle("active", mode === 'quiz');
    document.getElementById("btn-test").classList.toggle("active", mode === 'test');
    
    document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));
    document.querySelectorAll('.key-layer').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.part-item-btn').forEach(b => {
      b.className = "part-item-btn"; 
    });

    const form = document.getElementById("input-form");
    const summaryBar = document.getElementById("test-summary-bar");

    const inputField = document.getElementById("answer-input");
    inputField.disabled = false;
    document.getElementById("submit-btn").disabled = false;
    document.getElementById("submit-btn").innerText = "決定";

    if (mode === 'browse') {
      document.getElementById("control-panel").appendChild(form);
      form.style.display = "none";
      summaryBar.style.display = "none";
      document.getElementById("parts-list-container").style.display = "block";
      buildPartsList(); 
      document.getElementById("info-display").innerText = "サックスのパーツにマウスを当ててみてください";
      document.getElementById("info-sub").innerText = "-";
      resetZoom();
    } else if (mode === 'quiz') {
      document.getElementById("dynamic-placement-zone").appendChild(form);
      form.style.display = "flex";
      summaryBar.style.display = "none";
      document.getElementById("parts-list-container").style.display = "none";
      quizList = Object.keys(keyData);
      nextQuiz();
    } else if (mode === 'test') {
      document.getElementById("dynamic-placement-zone").appendChild(form);
      form.style.display = "none"; 
      summaryBar.style.display = "flex";
      document.getElementById("parts-list-container").style.display = "block";
      
      testAnswers = {};
      isGraded = false;
      quizCorrectId = "";
      testOrder = shuffleArray(Object.keys(keyData)); 
      
      document.getElementById("info-display").innerText = "パーツ一覧か画像上のエリアを選んで、名前を入力してください";
      document.getElementById("info-sub").innerText = "ボタンの並び順は毎回ランダムに変わります。好きな順で解答可能です";
      
      buildPartsList(); 
      updateTestProgressBar();
      refreshTestGridButtons();
      resetZoom();
    }
  }

  function selectTestPart(id) {
    quizCorrectId = id;
    
    document.querySelectorAll('.part-item-btn').forEach(b => b.classList.remove('active-part'));
    document.getElementById(`btn_list_${id}`)?.classList.add('active-part');

    document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));
    document.getElementById(`hitbox_${id}`)?.classList.add('quiz-target');

    document.querySelectorAll('.key-layer').forEach(el => el.classList.remove('show'));
    document.getElementById(`layer_${id}`)?.classList.add("show");

    focusOnPart(id);

    const form = document.getElementById("input-form");
    form.style.display = "flex";

    const display = document.getElementById("info-display");
    const inputField = document.getElementById("answer-input");

    if (!isGraded) {
      display.innerText = "この位置にあるパーツの名前は？";
      display.style.color = "var(--accent-color)";
      document.getElementById("info-sub").innerText = "いつでも後から上書き修正できます";
      
      inputField.value = testAnswers[id] || "";
      inputField.disabled = false;
      document.getElementById("submit-btn").disabled = false;
      document.getElementById("submit-btn").innerText = "仮保存";
      
      setTimeout(() => { inputField.focus({ preventScroll: true }); }, 50);
    } else {
      const userAns = testAnswers[id] || "(未入力)";
      const correctAns = keyData[id];
      const isCorrect = cleanStr(userAns) === cleanStr(correctAns);
      
      display.innerText = isCorrect ? "⭕ 正解！" : "❌ 不正解";
      display.style.color = isCorrect ? "var(--success-color)" : "var(--error-color)";
      document.getElementById("info-sub").innerText = `あなたの解答: ${userAns} / 正解: ${correctAns}`;
      
      inputField.value = userAns;
      inputField.disabled = true;
      document.getElementById("submit-btn").disabled = true;
    }
  }

  function refreshTestGridButtons() {
    testOrder.forEach((id, index) => {
      const btn = document.getElementById(`btn_list_${id}`);
      if (!btn) return;

      if (isGraded) {
        const userAns = testAnswers[id] || "";
        const correctAns = keyData[id];
        if (cleanStr(userAns) === cleanStr(correctAns)) {
          btn.className = "part-item-btn test-correct";
          btn.innerText = `⭕ ${correctAns}`;
        } else {
          btn.className = "part-item-btn test-incorrect";
          btn.innerText = `❌ ${correctAns}`;
        }
      } else {
        btn.className = "part-item-btn";
        if (testAnswers[id]) {
          btn.classList.add("has-filled");
          btn.innerText = `📝 [解答済] #${index + 1}`;
        } else {
          btn.innerText = `❓ パーツ #${index + 1}`;
        }
      }
    });
  }

  function updateTestProgressBar() {
    const total = Object.keys(keyData).length;
    const filled = Object.keys(testAnswers).length;
    document.getElementById("test-progress-text").innerText = `解答状況: ${filled} / ${total} パーツ`;
    
    if (filled === total && !isGraded) {
      document.getElementById("test-progress-text").innerHTML = `解答状況: ${filled} / ${total} 🎉 全て埋まりました！`;
    }
  }

  function cleanStr(str) {
    return str.replace(/\s+/g, "").toLowerCase();
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    const inputField = document.getElementById("answer-input");
    const userAns = inputField.value.trim();

    if (currentMode === 'quiz') {
      inputField.disabled = true;
      document.getElementById("submit-btn").disabled = true;
      const display = document.getElementById("info-display");
      const correctAns = keyData[quizCorrectId];

      if (!userAns) {
        display.innerText = `降参！ 答えは【${correctAns}】です`;
        display.style.color = "var(--error-color)";
      } else if (cleanStr(userAns) === cleanStr(correctAns)) {
        display.innerText = `⭕ 正解！【${correctAns}】`;
        display.style.color = "var(--success-color)";
      } else {
        display.innerText = `❌ 不正解！ 答:【${correctAns}】`;
        display.style.color = "var(--error-color)";
      }
      setTimeout(() => { if (currentMode === 'quiz') nextQuiz(); }, 1800);

    } else if (currentMode === 'test') {
      if (isGraded) return;

      if (userAns) {
        testAnswers[quizCorrectId] = userAns;
      } else {
        delete testAnswers[quizCorrectId];
      }

      refreshTestGridButtons();
      updateTestProgressBar();

      const activeBtn = document.getElementById(`btn_list_${quizCorrectId}`);
      if (activeBtn) {
        activeBtn.style.borderColor = "var(--success-color)";
        setTimeout(() => { activeBtn.style.borderColor = ""; }, 300);
      }

      document.getElementById("info-display").innerText = "入力値を仮保存しました！";
      
      let currentIndex = testOrder.indexOf(quizCorrectId);
      let nextId = null;

      for (let i = currentIndex + 1; i < testOrder.length; i++) {
        if (!testAnswers[testOrder[i]]) {
          nextId = testOrder[i];
          break;
        }
      }
      if (!nextId) {
        for (let i = 0; i < currentIndex; i++) {
          if (!testAnswers[testOrder[i]]) {
            nextId = testOrder[i];
            break;
          }
        }
      }

      if (nextId) {
        selectTestPart(nextId); 
      } else {
        document.getElementById("info-display").innerText = "🎉 すべてのパーツを解答しました！";
        document.getElementById("info-sub").innerText = "上部のボタンから一括採点してください";
        document.getElementById("answer-input").value = "";
        document.getElementById("answer-input").disabled = true;
        document.getElementById("submit-btn").disabled = true;
        resetZoom(); 
      }
    }
  }

  function gradeAllTestAnswers() {
    if (isGraded) {
      switchMode('test');
      return;
    }

    isGraded = true;
    const total = Object.keys(keyData).length;
    let score = 0;

    Object.keys(keyData).forEach(id => {
      const userAns = testAnswers[id] || "";
      const correctAns = keyData[id];
      if (cleanStr(userAns) === cleanStr(correctAns)) {
        score++;
      }
    });

    const accuracy = Math.round((score / total) * 100);
    
    document.getElementById("input-form").style.display = "none";
    document.getElementById("test-progress-text").innerHTML = `
      採点結果: <span style="color:var(--success-color); font-size:16px;">${score}</span> / ${total} 正解 (${accuracy}%)
    `;
    document.getElementById("final-score-btn").innerText = "🔄 もう一度テストする";
    
    document.getElementById("info-display").innerText = "📊 採点が完了しました！";
    document.getElementById("info-sub").innerText = "下のパーツ一覧をクリックすると、それぞれの答え合わせができます";
    document.getElementById("info-display").style.color = "var(--accent-color)";

    refreshTestGridButtons();
    resetZoom();
    document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));
    document.querySelectorAll('.key-layer').forEach(el => el.classList.remove('show'));
  }

  function nextQuiz() {
    if (quizList.length === 0) quizList = Object.keys(keyData);
    const randomIndex = Math.floor(Math.random() * quizList.length);
    quizCorrectId = quizList.splice(randomIndex, 1)[0];

    document.getElementById("info-display").innerText = "このハイライトされたパーツの名前は？";
    document.getElementById("info-display").style.color = "var(--accent-color)";
    document.getElementById("info-sub").innerText = "💡 わからない時は空欄のまま決定でパス";

    const inputField = document.getElementById("answer-input");
    inputField.value = "";
    inputField.disabled = false;
    document.getElementById("submit-btn").disabled = false;
    document.getElementById("submit-btn").innerText = "決定";

    document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));
    document.getElementById(`hitbox_${quizCorrectId}`)?.classList.add('quiz-target');

    document.querySelectorAll('.key-layer').forEach(el => el.classList.remove('show'));
    document.getElementById(`layer_${quizCorrectId}`)?.classList.add("show");

    focusOnPart(quizCorrectId);
    setTimeout(() => { inputField.focus({ preventScroll: true }); }, 80);
  }

  function focusOnPart(id) {
    const points = pathCoordinates[id];
    if (!points || points.length === 0) return;

    let sumX = 0, sumY = 0;
    points.forEach(p => { sumX += p[0]; sumY += p[1]; });
    const centerX = sumX / points.length;
    const centerY = sumY / points.length;

    const viewport = document.getElementById('view-viewport');
    const viewWidth = viewport.clientWidth;
    const viewHeight = viewport.clientHeight;

    const baseScale = viewWidth / canvasWidth;
    const zoomFactor = 2.4; 
    const finalScale = baseScale * zoomFactor;

    const tx = (viewWidth / 2) - (centerX * finalScale);
    const ty = (viewHeight / 2) - (centerY * finalScale);

    document.getElementById('scalableWrapper').style.transform = `translate(${tx}px, ${ty}px) scale(${finalScale})`;
  }

  function resetZoom() {
    const viewport = document.getElementById('view-viewport');
    if (!viewport) return;
    const baseScale = viewport.clientWidth / canvasWidth;
    document.getElementById('scalableWrapper').style.transform = `translate(0px, 0px) scale(${baseScale})`;
  }

  function updateLayout() {
    if (currentMode === 'browse') resetZoom();
    else if (quizCorrectId && currentMode !== 'browse') focusOnPart(quizCorrectId);
  }
  </script>
</body>
