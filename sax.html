<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>サックス パーツ記述テスト</title>
  <style>
    :root {
      --bg-color: #121214;
      --panel-bg: #1a1a1e;
      --accent-color: #ffb86c;
      --success-color: #50fa7b;
      --error-color: #ff5555;
      --text-color: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    #mode-control, #dynamic-placement-zone, #view-viewport, #control-panel, #parts-list-container {
      width: 100%;
      max-width: 900px; 
      box-sizing: border-box;
    }

    /* モード切り替え */
    #mode-control {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }
    .mode-btn {
      flex: 1;
      background: #2a2a32;
      color: #fff;
      border: 2px solid #444;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .mode-btn.active {
      border-color: var(--accent-color);
      background: rgba(255, 184, 108, 0.1);
      color: var(--accent-color);
    }

    /* ビューポート */
    #view-viewport {
      aspect-ratio: 4 / 3;
      background: #09090b;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid #232329;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #scalableWrapper {
      position: absolute;
      width: 1200px;
      height: 900px;
      transform-origin: 0 0;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .sax-canvas {
      position: absolute;
      width: 1200px;
      height: 900px;
    }

    .base-image {
      position: absolute;
      width: 1200px;
      height: 900px;
      pointer-events: none;
      opacity: 0.8;
    }

    .key-layer {
      position: absolute;
      width: 1200px;
      height: 900px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .key-layer.show {
      opacity: 1;
    }

    #svgOverlay {
      position: absolute;
      width: 1200px;
      height: 900px;
    }

    /* 当たり判定の設定：完全に透明 */
    .clickable-trigger {
      fill: rgba(0, 0, 0, 0); 
      stroke: rgba(0, 0, 0, 0);
      stroke-width: 1;
      cursor: pointer;
    }
    .clickable-trigger:hover {
      fill: rgba(0, 0, 0, 0);
    }
    .clickable-trigger.quiz-target {
      fill: rgba(0, 0, 0, 0);
      stroke: rgba(0, 0, 0, 0);
      stroke-width: 1;
    }

    /* コントロールエリア */
    #control-panel {
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid #2e2e38;
    }

    #info-display {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 2px;
    }
    #info-sub {
      font-size: 12px;
      color: #8a8a93;
      text-align: center;
      font-family: monospace;
      margin-bottom: 12px;
    }

    /* 記述フォームのスマホ最適化調整 */
    #input-form {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 8px; /* 上部配置時の余白 */
    }

    #answer-input {
      flex: 1;
      background: #121214;
      color: #fff;
      border: 1px solid #444;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    #answer-input:focus {
      border-color: var(--accent-color);
      outline: none;
    }

    #submit-btn {
      background: var(--accent-color);
      color: #121214;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* パーツ一覧エリア */
    #parts-list-container {
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid #2e2e38;
    }
    #parts-list-title {
      font-size: 14px;
      font-weight: bold;
      color: #8a8a93;
      margin-bottom: 10px;
      border-bottom: 1px solid #2e2e38;
      padding-bottom: 5px;
    }
    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 6px;
    }
    .part-item-btn {
      background: #2a2a32;
      color: #e2e8f0;
      border: 1px solid #444;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
    }
    .part-item-btn:hover {
      border-color: var(--accent-color);
      background: rgba(255, 184, 108, 0.1);
    }
    .part-item-btn.active-part {
      border-color: var(--accent-color);
      background: var(--accent-color);
      color: #121214;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- モード切替 -->
  <div id="mode-control">
    <button id="btn-browse" class="mode-btn active" onclick="switchMode('browse')">🔍 探索モード</button>
    <button id="btn-quiz" class="mode-btn" onclick="switchMode('quiz')">📝 記述テスト</button>
  </div>

  <!-- スマホでのスクロール対策：クイズ時にフォームがここに移動してきます -->
  <div id="dynamic-placement-zone"></div>

  <!-- ビューポート -->
  <div id="view-viewport">
    <div id="scalableWrapper">
      <div class="sax-canvas">
        <img src="base_front.PNG" class="base-image" alt="Saxophone Base">
        <svg id="svgOverlay">
          <g id="polygonGroup"></g>
        </svg>
      </div>
    </div>
  </div>

  <!-- 下部：入力・情報エリア -->
  <div id="control-panel">
    <div id="info-display">サックスのパーツにマウスを当ててみてください</div>
    <div id="info-sub">-</div>
    
    <!-- 記述入力フォーム（初期状態） -->
    <form id="input-form" style="display: none;" onsubmit="handleFormSubmit(event)">
      <input type="text" id="answer-input" placeholder="空欄のまま解答でパス..." autocomplete="off" enterkeyhint="send">
      <button type="submit" id="submit-btn">解答</button>
    </form>
  </div>

  <!-- パーツ名前一覧 -->
  <div id="parts-list-container">
    <div id="parts-list-title">📋 パーツ一覧（クリックで該当位置へズーム）</div>
    <div class="parts-grid" id="partsGrid"></div>
  </div>

  <script>
  const canvasWidth = 1200;  
  const canvasHeight = 900; 
  let currentMode = 'browse';
  let quizCorrectId = "";
  let quizList = [];

  // 🌟 "c_sharp_lever" の値を "G#レバー" に修正しました
  const keyData = {"mouthpiece":"マウスピース","ligature":"リガチャー","neck_cork":"ネックコルク","octave_1":"第1オクターブキィ","octave_2":"第2オクターブキィ","high_f_sharp_key":"HighF#キィ","high_f_key":"HighFキィ","high_e_key":"HighEキィ","front_f_lever":"フロントFレバー","c_key":"Cキィ","b_key":"Bキィ","bb_key":"Bbキィ","a_key":"Aキィ","g_key":"Gキィ","g_sharp_key":"G#キィ","f_sharp_key":"F#キィ","f_key":"Fキィ","e_key":"Eキィ","d_key":"Dキィ","eb_key":"Ebキィ","low_c_key":"LowCキィ","low_c_sharp_key":"LowC#キィ","low_b_key":"LowBキィ","low_bb_key":"LowBbキィ","bell":"ベル","key_guard":"キィガード","neck_screw":"ネック止めネジ","high_f_sharp_key_back":"HighF#キィ","high_f_key_back":"HighFキィ","high_eb_key":"HighEbキィ","high_d_key":"HighDキィ","c_sharp_lever":"G#レバー","low_b_key_back":"LowBキィ","low_c_sharp_lever":"LowC#レバー","low_bb_key_back":"LowBbキィ","pipe_2":"2番管","thumb_hook":"サムフック","side_guard_cross_guard":"サイドガード/クロスガード","body_ring":"胴輪","pipe_1":"1番管","eb_key_back":"Ebキィ","high_f_sharp_lever":"HighF#レバー","side_bb_lever":"SideBbレバー","side_c_lever":"SideCレバー","side_f_sharp_key":"SideF#キィ","high_e_key_back":"HighEキィ","lap_ring":"ラップリング","side_bb_key":"SideBbキィ","side_c_key":"SideCキィ","thumb_rest":"サムレスト","tar_lever":"ターブレバー","lyre_holder":"譜立て","reinforcement_plate":"補強版"};
  const pathCoordinates = {"mouthpiece":[[105,140],[140,130],[169,146],[160,158],[141,158],[120,150]],"ligature":[[127,126],[150,129],[134,165],[117,157]],"neck_cork":[[166,140],[181,151],[174,166],[151,160]],"front_f_lever":[[272,322],[275,343],[278,375],[258,385],[267,349],[251,341],[266,326]],"bell":[[295,500],[363,516],[420,564],[379,596],[367,649],[361,769],[327,770],[309,711],[324,644],[288,638]],"key_guard":[[290,642],[326,638],[308,654],[306,706],[303,766],[316,782],[287,856],[247,868],[212,830],[258,852],[283,828],[278,758]],"octave_1":[[221,288],[242,287],[239,298],[221,291]],"octave_2":[[195,153],[196,148],[259,173],[272,238],[263,200],[255,226],[227,245],[252,220],[256,189],[235,169]],"high_f_sharp_key":[[250,259],[266,262],[266,284],[250,281],[219,287],[249,275]],"high_f_key":[[265,279],[277,281],[284,397],[305,436],[274,410],[278,377],[268,307]],"high_e_key":[[242,299],[257,298],[257,320],[239,322],[240,312],[224,309],[239,305]],"c_key":[[227,362],[252,362],[259,353],[266,362],[259,372],[255,365],[228,369]],"b_key":[[226,393],[252,382],[273,380],[277,403],[263,409],[247,397]],"bb_key":[[248,417],[275,425],[277,448],[248,447],[244,438],[224,435],[246,427]],"a_key":[[249,459],[273,460],[274,477],[249,480],[247,475],[226,472],[252,470]],"g_key":[[250,490],[270,489],[270,525],[249,526],[246,506],[217,505],[248,502]],"g_sharp_key":[[248,537],[278,536],[275,565],[246,569],[245,556],[221,552],[245,548]],"f_sharp_key":[[240,581],[272,579],[271,611],[241,613]],"f_key":[[235,619],[275,619],[275,659],[235,659]],"e_key":[[237,671],[277,671],[277,711],[237,711]],"d_key":[[235,717],[275,717],[272,753],[261,766],[235,757]],"eb_key":[[199,800],[228,777],[230,793],[221,798],[202,807]],"low_c_key":[[258,815],[269,830],[264,848],[237,844],[238,820],[222,798],[198,783],[213,784],[242,814]],"low_c_sharp_key":[[306,798],[314,817],[306,840],[286,833],[289,815],[274,780],[295,807]],"low_b_key":[[278,703],[279,731],[297,724],[313,741],[309,769],[283,774],[270,732]],"low_bb_key":[[270,632],[284,629],[278,653],[312,671],[295,699],[273,683]],"neck_screw":[[822,268],[839,265],[834,280],[821,276]],"high_f_sharp_key_back":[[916, 290],[926, 291],[925,311],[911,312]],"high_f_key_back":[[925,307],[943,307],[936,327],[935,389],[930,426],[933,462],[922,464],[928,424],[931,391],[930,331],[926,328]],"high_eb_key":[[940,341],[957,345],[955,358],[943,363],[941,397],[940,414],[932,428],[928,411],[937,399],[937,361]],"high_d_key":[[954,361],[964,370],[957,385],[957,417],[962,434],[956,456],[949,437],[953,419],[951,386],[943,373]],"c_sharp_lever":[[915,489],[927,485],[930,484],[933,487],[935,495],[915,499]],"low_b_key_back":[[915,502],[928,501],[930,512],[918,515]],"low_c_sharp_lever":[[929,502],[941,494],[945,512],[934,513]],"low_bb_key_back":[[918,519],[951,515],[948,532],[924,534]],"pipe_2":[[942,414],[962,414],[946,422],[947,455],[960,451],[978,767],[926,771],[938,569],[928,540],[953,532],[943,487],[928,479],[939,454],[932,431]],"thumb_hook":[[973,669],[1009,655],[1007,669],[1002,675],[984,666],[981,724],[974,725]],"side_guard_cross_guard":[[942,630],[956,630],[957,730],[946,754],[945,705]],"body_ring":[[925,774],[982,782],[978,788],[922,790]],"pipe_1":[[877,799],[922,790],[975,788],[966,829],[947,856],[913,872],[878,866]],"eb_key_back":[[782,811],[819,836],[790,847],[762,845],[759,816]],"high_f_sharp_lever":[[811,680],[821,679],[821,716],[811,717]],"side_bb_lever":[[804,673],[816,672],[815,699],[805,697]],"side_c_lever":[[805,645],[817,646],[815,672],[803,669]],"side_f_sharp_key":[[764,640],[783,642],[782,657],[803,662],[781,662],[783,673],[765,674]],"high_e_key_back":[[810,621],[822,618],[815,639],[804,642],[806,632]],"lap_ring":[[774,541],[794,545],[796,569],[772,562]],"side_bb_key":[[787, 485],[809,486],[810,506],[799,510],[800,558],[790,557],[792,511],[785,508]],"side_c_key":[[785,420],[810,420],[808,444],[804,443],[802,445],[795,478],[794,448],[786,445]],"tar_lever":[[777, 341],[787,341],[783,360],[790,378],[787,410],[775,380]],"lyre_holder":[[778,307],[791,308],[792,326],[778,325]],"reinforcement_plate":[[759,192],[795,210],[803,231],[798,248],[788,223]],"thumb_rest":[[781,398],[780,417],[774,408],[786,409]]};

  document.addEventListener("DOMContentLoaded", () => {
    initImages();
    buildHitboxes();
    buildPartsList();
    updateLayout();
  });
  window.addEventListener('resize', updateLayout);

  function initImages() {
    const canvas = document.querySelector('.sax-canvas');
    const overlay = document.getElementById('svgOverlay');
    Object.keys(keyData).forEach(id => {
      const img = document.createElement('img');
      let fileName = id;
      if (id === "f_sharp_key") fileName = "f_sharp";
      else if (id === "g_sharp_key") fileName = "g_sharp_key";
      else if (id.startsWith("high_") && !id.endsWith("_back") && id !== "high_eb_key" && id !== "high_d_key") fileName = id.replace("_key", "");
      else if (id.startsWith("low_") && !id.endsWith("_back") && !id.endsWith("_lever")) fileName = id.replace("_key", "");
      
      img.src = `${fileName}.PNG`;
      img.id = `layer_${id}`;
      img.classList.add('key-layer');
      canvas.insertBefore(img, overlay);
    });
  }

  function buildHitboxes() {
    const group = document.getElementById("polygonGroup");
    Object.keys(pathCoordinates).forEach(id => {
      const points = pathCoordinates[id];
      if (points.length < 2) return;
      
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const dStr = points.map((p, i) => `${i===0?'M':'L'}${p[0]},${p[1]}`).join(" ") + " Z";
      path.setAttribute("d", dStr);
      path.setAttribute("id", `hitbox_${id}`);
      path.setAttribute("class", "clickable-trigger");
      
      path.addEventListener("mouseenter", () => {
        if (currentMode !== 'browse') return;
        document.querySelectorAll('.part-item-btn').forEach(b => b.classList.remove('active-part'));
        document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));

        document.getElementById("info-display").innerText = keyData[id];
        document.getElementById("info-sub").innerText = `ID: ${id}`;
        document.getElementById(`layer_${id}`)?.classList.add("show");
      });

      path.addEventListener("mouseleave", () => {
        if (currentMode !== 'browse') return;
        document.getElementById("info-display").innerText = "サックスのパーツにマウスを当ててみてください";
        document.getElementById("info-sub").innerText = "-";
        document.getElementById(`layer_${id}`)?.classList.remove("show");
      });
      group.appendChild(path);
    });
  }

  function buildPartsList() {
    const grid = document.getElementById("partsGrid");
    grid.innerHTML = "";
    Object.keys(keyData).forEach(id => {
      const btn = document.createElement("button");
      btn.className = "part-item-btn";
      btn.id = `btn_list_${id}`;
      btn.innerText = keyData[id];
      
      btn.addEventListener("click", () => {
        if (currentMode !== 'browse') return;

        document.querySelectorAll('.key-layer').forEach(el => el.classList.remove('show'));
        document.querySelectorAll('.part-item-btn').forEach(b => b.classList.remove('active-part'));
        document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));

        document.getElementById(`layer_${id}`)?.classList.add("show");
        document.getElementById(`hitbox_${id}`)?.classList.add('quiz-target');
        btn.classList.add("active-part");

        document.getElementById("info-display").innerText = keyData[id];
        document.getElementById("info-sub").innerText = `ID: ${id}`;

        focusOnPart(id);
      });
      grid.appendChild(btn);
    });
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById("btn-browse").classList.toggle("active", mode === 'browse');
    document.getElementById("btn-quiz").classList.toggle("active", mode === 'quiz');
    
    document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));
    document.querySelectorAll('.key-layer').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.part-item-btn').forEach(b => b.classList.remove('active-part'));

    const form = document.getElementById("input-form");

    if (mode === 'browse') {
      // 探索モード時は下部の通常位置に戻す
      document.getElementById("control-panel").appendChild(form);
      form.style.display = "none";
      document.getElementById("parts-list-container").style.display = "block";
      document.getElementById("info-display").innerText = "サックスのパーツにマウスを当ててみてください";
      document.getElementById("info-sub").innerText = "-";
      resetZoom();
    } else {
      // 🌟 【スマホ対策】クイズモード時はフォームを画像の上に動的移動させる
      document.getElementById("dynamic-placement-zone").appendChild(form);
      form.style.display = "flex";
      document.getElementById("parts-list-container").style.display = "none";
      quizList = Object.keys(keyData);
      nextQuiz();
    }
  }

  function nextQuiz() {
    if (quizList.length === 0) quizList = Object.keys(keyData);
    
    const randomIndex = Math.floor(Math.random() * quizList.length);
    quizCorrectId = quizList.splice(randomIndex, 1)[0];

    const display = document.getElementById("info-display");
    display.style.color = "var(--accent-color)";
    display.innerText = "このハイライトされたパーツの名前は？";
    document.getElementById("info-sub").innerText = "💡 わからない時は空欄のまま解答でパス";

    const inputField = document.getElementById("answer-input");
    inputField.value = "";
    inputField.disabled = false;
    document.getElementById("submit-btn").disabled = false;

    document.querySelectorAll('.clickable-trigger').forEach(el => el.classList.remove('quiz-target'));
    document.getElementById(`hitbox_${quizCorrectId}`)?.classList.add('quiz-target');

    document.querySelectorAll('.key-layer').forEach(el => el.classList.remove('show'));
    document.getElementById(`layer_${quizCorrectId}`)?.classList.add("show");

    focusOnPart(quizCorrectId);

    // 🌟 【スマホ対策】強制スクロールを防ぐため、画面の一番上までビューを引き戻す
    document.getElementById("mode-control").scrollIntoView({ behavior: "smooth", block: "start" });

    setTimeout(() => {
      // 🌟 preventScroll: true でフォーカス時のブラウザ標準のガタつきスクロールを抑制
      inputField.focus({ preventScroll: true });
    }, 80);
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    const inputField = document.getElementById("answer-input");
    const userAns = inputField.value.trim();
    const correctAns = keyData[quizCorrectId];

    inputField.disabled = true;
    document.getElementById("submit-btn").disabled = true;

    const display = document.getElementById("info-display");

    if (!userAns) {
      display.innerText = `降参！ 答えは【${correctAns}】です`;
      display.style.color = "var(--error-color)";
    } else {
      const cleanUser = userAns.replace(/\s+/g, "").toLowerCase();
      const cleanCorrect = correctAns.replace(/\s+/g, "").toLowerCase();

      if (cleanUser === cleanCorrect) {
        display.innerText = `⭕ 正解！【${correctAns}】`;
        display.style.color = "var(--success-color)";
      } else {
        display.innerText = `❌ 不正解！ 答:【${correctAns}】`;
        display.style.color = "var(--error-color)";
      }
    }

    setTimeout(() => {
      if (currentMode === 'quiz') nextQuiz();
    }, 1800);
  }

  function focusOnPart(id) {
    const points = pathCoordinates[id];
    if (!points || points.length === 0) return;

    let sumX = 0, sumY = 0;
    points.forEach(p => { sumX += p[0]; sumY += p[1]; });
    const centerX = sumX / points.length;
    const centerY = sumY / points.length;

    const viewport = document.getElementById('view-viewport');
    const viewWidth = viewport.clientWidth;
    const viewHeight = viewport.clientHeight;

    const baseScale = viewWidth / canvasWidth;
    const zoomFactor = 2.4; 
    const finalScale = baseScale * zoomFactor;

    const tx = (viewWidth / 2) - (centerX * finalScale);
    const ty = (viewHeight / 2) - (centerY * finalScale);

    document.getElementById('scalableWrapper').style.transform = `translate(${tx}px, ${ty}px) scale(${finalScale})`;
  }

  function resetZoom() {
    const viewport = document.getElementById('view-viewport');
    const baseScale = viewport.clientWidth / canvasWidth;
    document.getElementById('scalableWrapper').style.transform = `translate(0px, 0px) scale(${baseScale})`;
  }

  function updateLayout() {
    if (currentMode === 'browse') resetZoom();
    else if (quizCorrectId) focusOnPart(quizCorrectId);
  }
  </script>
</body>
</html>
